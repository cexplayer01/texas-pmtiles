<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Texas PMTiles — render check</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@3/dist/pmtiles.js"></script>
<style>html,body,#map{margin:0;height:100%;background:#0b0e13}</style>
</head>
<body>
<div id="map"></div>
<script>
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);
const p = new pmtiles.PMTiles("https://texas-tiles.netlify.app/texas.pmtiles");
protocol.add(p);
const style = {
  version: 8,
  sources: { tx: { type: "vector", url: "pmtiles://https://texas-tiles.netlify.app/texas.pmtiles" } },
  layers: [
    { id: "bg", type: "background", paint: { "background-color": "#0b0e13" } },
    { id: "water", type: "fill", source: "tx", "source-layer": "water",
      filter: ["!=", "brunnel", "tunnel"],
      paint: { "fill-color": "#1d4e5f" } },
    { id: "landcover", type: "fill", source: "tx", "source-layer": "landcover",
      paint: { "fill-color": "#12251a", "fill-opacity": 0.6 } },
    { id: "park", type: "fill", source: "tx", "source-layer": "park",
      paint: { "fill-color": "#17351f" } },
    { id: "building", type: "fill", source: "tx", "source-layer": "building", minzoom: 13,
      paint: { "fill-color": "#3a4152" } },
    { id: "road-casing", type: "line", source: "tx", "source-layer": "transportation", minzoom: 6,
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": "#05070a", "line-width": ["interpolate", ["linear"], ["zoom"], 6, 1, 11, 4, 14, 9] } },
    { id: "road", type: "line", source: "tx", "source-layer": "transportation", minzoom: 6,
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": ["match", ["get", "class"], "motorway", "#e08a3c", "trunk", "#c9a227", "#8f97a8"],
               "line-width": ["interpolate", ["linear"], ["zoom"], 6, 0.6, 11, 2.4, 14, 6] } }
  ]
};
const map = new maplibregl.Map({ container: "map", style: style, center: [-96.797, 32.777], zoom: 11 });
map.on("load", () => { window.__mapLoaded = true; });
</script>
</body>
</html>
